libstartup-notification.repo=https://github.com/bbidulock/startup-notification.git
libstartup-notification.sha=b610115135fdb54fc16e775334438b1e9e8fbfdd
libstartup-notification.note=has submodules; --recursive on clone AND fetch
# Already correctly pinned inline; recorded here so verify-pins.sh covers it.
imlib2.repo=https://github.com/gijsbers/imlib2.git
imlib2.sha=fc333014c37b7ad9534e5e50c4df12964a1b84f7
