# pins.lock - every upstream input to the rlos image, pinned.
#
# Read by pins.sh (sourced) and checked by verify-pins.sh. Nothing here is
# generated; edit it by hand when bumping an upstream.
#
# WHY THIS EXISTS
#   Without it, "master" and "main" float. A build that is green today can be a
#   different image tomorrow, with no error and no way to tell afterwards. Two
#   of the entries below (xfiles, linux) pin commits that are AHEAD of their
#   nearest release tag, because that is the tree this image was built from.
#
# WHAT A PIN DOES AND DOES NOT BUY YOU
#   sha256 pins are permanent: the bytes either hash to that or the build stops.
#   git pins are only as durable as the remote keeping the object reachable.
#   A commit that is no longer on any branch and is not tagged can, in
#   principle, be garbage-collected upstream and become unfetchable. The
#   sha256s cannot rot this way. If a pin here ever 404s, that is what happened.
#
# HOW TO BUMP
#   git:  clone/fetch the upstream, check out the commit you want, take
#         `git rev-parse HEAD`, and update the sha below. Record why in a note.
#   tar:  download the new artefact, run sha256sum, update sha256. Update the
#         URL too if the version changed. If the URL is generated from a
#         *_VER variable in the script, bump that variable too.

# ---------------------------------------------------------------------------
# git checkouts
# ---------------------------------------------------------------------------
# name         repo  ref  sha  note

[git]
# The kernel is deliberately NOT pinned. compile_kernel.sh keeps --depth 1
# against master, because the kernel is maintained here by hand: it is patched
# locally and rebased forward, so a pin would be wrong the moment a patch lands
# and would only create the illusion of a fixed kernel. Whoever builds it is
# responsible for the tree at ./linux.
#
# The two consequences, stated plainly:
#   - a build on a different day can use a different kernel, and nothing here
#     will stop that;
#   - for a reproducible build, record the kernel SHA alongside the image, e.g.
#     `git -C linux rev-parse HEAD` into your release notes.
#
# Note kernel.org does not support partial clone ("filtering not recognized by
# server"), so pinning by SHA would mean a full multi-GB fetch here, not a cheap
# blobless one.
linux.repo=https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
linux.sha=
linux.note=UNPINNED BY DESIGN - kernel is patched and rebased locally; see above

# linux-firmware. NOTE the checkout lives at fw-src/linux-firmware, not fw-src -
# fw-src is a plain directory and `git -C fw-src rev-parse` silently walks up to
# the rlos repo, which will hand you an rlos commit instead of a firmware one.
# Ask for the SHA from fw-src/linux-firmware explicitly.
linux-firmware.repo=https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git
linux-firmware.sha=d947e4e8e314e9254a1242dc1a5d9cede2cce33d
linux-firmware.note=blobless clone + sparse-checkout of a few driver dirs; 2026-10-02

# The rl-lang toolchain. Checked out as a symlink inside the repo (./rl-lang);
# build_rl_bins.sh, build_gcc.sh and rlos-atom/build_atom_rl.sh all read it.
rl-lang.repo=https://github.com/rl-lang/rl-lang.git
rl-lang.sha=bd825f78c1dc900e47afc74ca7b49f5fe788ae03
rl-lang.note=branch dev at pin time; "add parity to terminal library for c transpiler"

# Symlinked build inputs for the toolchain. Not fetched by any script - you
# clone these yourself and symlink them in. The pins are here so that
# bootstrap can tell you exactly which commit to check out.
gcc.repo=https://github.com/gcc-mirror/gcc.git
gcc.sha=78d4ac73dd391005b895a6148cd9831e28e1208b
gcc.note=releases/gcc-16.2.0; symlink as ./gcc
binutils.repo=https://github.com/gnutools/binutils-gdb.git
binutils.sha=5e56594815854de5eca35c7c04b11705d0f19c02
binutils.note=binutils-2_46_1; symlink as ./binutils
git.repo=https://github.com/git/git.git
git.sha=e9019fcafe0040228b8631c30f97ae1adb61bcdc
git.note=v2.55.0 exactly; symlink as ./git-src

# Desktop. i3, yajl and libXft were already pinned in build_x11.sh by tag and
# keep their own *_REF variables - they move to this file in one step.

# 100 commits AHEAD of v1.1.1. Pinning to the tag would lose the scrollmode,
# pgup/pgdown and focus fixes this image was built against.
